apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voltrix-main-ingress
  namespace: voltrix-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: "nginx"
  rules:
    # 1. Previews Route
    - host: "*.previews.usevoltrix.xyz"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voltrix-proxy
                port:
                  number: 80

    # 2. API Gateway Route
    - host: "api.usevoltrix.xyz"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80